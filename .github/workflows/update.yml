name: 실거래가 갱신 및 배포
on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
        run: python collector/collect.py
      - name: 자료 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data collector/geocache.json collector/raw_sample.xml
          git diff --cached --quiet || git commit -m "자료 갱신"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
